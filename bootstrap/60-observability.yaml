# Estas aplicaciones se añaden al app-of-apps existente en eventosu-gitops/bootstrap
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "89.2.0"
    helm:
      releaseName: observability
      valueFiles: []
      valuesObject:
        fullnameOverride: observability
        alertmanager:
          enabled: true
        grafana:
          fullnameOverride: grafana
          admin:
            existingSecret: ""
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
            datasources:
              defaultDatasourceUID: prometheus
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki-gateway.observabilidad.svc.cluster.local
              jsonData:
                derivedFields:
                  - name: traceId
                    matcherRegex: '"traceId":"([a-f0-9]{32})"'
                    datasourceUid: tempo
                    url: '$${__value.raw}'
            - name: Tempo
              uid: tempo
              type: tempo
              access: proxy
              url: http://tempo.observabilidad.svc.cluster.local:3200
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: true
                  filterBySpanID: false
                  tags: [service.name]
        prometheus:
          prometheusSpec:
            retention: 10d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorNamespaceSelector: {}
            podMonitorNamespaceSelector: {}
            ruleNamespaceSelector: {}
            resources:
              requests: {cpu: 200m, memory: 400Mi}
              limits: {cpu: 600m, memory: 1Gi}
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: "1.24.4"
    helm:
      releaseName: tempo
      valuesObject:
        tempo:
          reportingEnabled: false
          retention: 48h
          receivers:
            otlp:
              protocols:
                grpc: {endpoint: "0.0.0.0:4317"}
                http: {endpoint: "0.0.0.0:4318"}
          storage:
            trace:
              backend: local
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
        persistence:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: "6.55.0"
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig: {replication_factor: 1}
          limits_config:
            allow_structured_metadata: true
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: {prefix: index_, period: 24h}
          storage:
            type: filesystem
        singleBinary:
          replicas: 1
          persistence: {enabled: false}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
        chunksCache: {enabled: false}
        resultsCache: {enabled: false}
        lokiCanary: {enabled: false}
        test: {enabled: false} # Sin test Helm, porque lokiCanary esta deshabilitado
        gateway: {enabled: true}
        read: {replicas: 0}
        write: {replicas: 0}
        backend: {replicas: 0}
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: platform
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.133.0"
    helm:
      releaseName: otel-collector
      valuesObject:
        fullnameOverride: otel-collector
        mode: daemonset
        image:
          repository: otel/opentelemetry-collector-contrib
        command: {name: otelcol-contrib}
        presets:
          logsCollection: {enabled: true, includeCollectorLogs: false}
          kubernetesAttributes: {enabled: true}
        ports:
          otlp: {enabled: true, containerPort: 4317, servicePort: 4317}
          otlp-http: {enabled: true, containerPort: 4318, servicePort: 4318}
        config:
          receivers:
            otlp:
              protocols:
                grpc: {endpoint: "0.0.0.0:4317"}
                http: {endpoint: "0.0.0.0:4318"}
          exporters:
            otlp/tempo:
              endpoint: tempo.observabilidad.svc.cluster.local:4317
              tls: {insecure: true}
            otlphttp/loki:
              endpoint: http://loki-gateway.observabilidad.svc.cluster.local/otlp
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [otlp/tempo]
              logs:
                receivers: [filelog]
                processors: [memory_limiter, k8sattributes, batch]
                exporters: [otlphttp/loki]
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 300m, memory: 384Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
