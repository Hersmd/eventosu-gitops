# Igual al de P8 (argocd/project.yaml), ahora versionado dentro del app-of-apps
# para que el clúster reconstruido lo tenga sin pasos manuales.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: eventosu
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: EventosU - GitOps (P8/P9). Todo cambio al clúster pasa por aquí.
  sourceRepos:
    - "https://github.com/hersmd/eventosu-gitops.git"
    - "https://github.com/hersmd/Practicas-SA-B-201704312.git"
  destinations:
    - namespace: sa-p5
      server: https://kubernetes.default.svc
    - namespace: sa-p5-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: policy
      kind: "*"
    - group: argoproj.io
      kind: "*"
    - group: bitnami.com
      kind: SealedSecret
