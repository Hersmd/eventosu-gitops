# AppProject de los componentes de PLATAFORMA (P9): controladores, políticas,
# respaldos y datos. El proyecto "eventosu" (P8) sigue siendo el de los
# microservicios, con permisos más estrechos.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Plataforma EventosU (P9) - instalada por el app-of-apps
  sourceRepos:
    - https://github.com/hersmd/eventosu-gitops.git
    - https://github.com/hersmd/Practicas-SA-B-201704312.git
    - https://argoproj.github.io/argo-helm
    - https://kyverno.github.io/kyverno/
    - https://vmware-tanzu.github.io/helm-charts
    - https://bitnami.github.io/sealed-secrets
    # Bitnami retiró charts.bitnami.com (ago-2025); PostgreSQL y RabbitMQ se
    # leen ahora del registro OCI. ArgoCD exige un sourceRepo por cada
    # repoURL exacto (no acepta un prefijo como oci://registry-1.docker.io/*).
    - oci://registry-1.docker.io/bitnamicharts/postgresql
    - oci://registry-1.docker.io/bitnamicharts/rabbitmq
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
