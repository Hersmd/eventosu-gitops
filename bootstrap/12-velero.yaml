apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      # Verifica el par chart/plugin: helm search repo vmware-tanzu/velero --versions
      # y la tabla de compatibilidad del repo velero-plugin-for-gcp.
      targetRevision: "8.*"
      helm:
        valueFiles:
          - $values/platform/velero/values.yaml
    - repoURL: https://github.com/hersmd/eventosu-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
