apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Recomendación oficial de Kyverno para ArgoCD (kyverno.io/docs/installation/
    # platform-notes): ServerSideApply=true evita la anotación gigante al APLICAR,
    # pero sin esto el paso de COMPARAR seguía generando un JSON de >256KB para
    # las 3 CRDs más grandes (clusterpolicies, policies, mutatingpolicies) y el
    # sync fallaba igual con "metadata.annotations: Too long".
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # Usa la misma versión mayor que tenías en P8 (helm list -A) y fíjala.
    targetRevision: "3.*"
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # ServerSideApply: los CRDs de Kyverno superan el límite de annotations.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
