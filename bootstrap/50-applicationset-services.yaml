apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: eventosu-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  generators:
    # Un archivo por componente y ambiente: imágenes y chartRevision se
    # promocionan juntos mediante PR, sin cambiar el otro ambiente.
    - git:
        repoURL: https://github.com/hersmd/eventosu-gitops.git
        revision: main
        files:
          - path: apps/*/image-*.yaml
  template:
    metadata:
      name: "{{component}}-{{env}}"
      namespace: argocd
    spec:
      project: eventosu
      sources:
        # Fuente 1: el chart de Helm, definido en el repo de CÓDIGO
        # (P10/charts/<servicio>) — la plantilla no cambia con cada
        # deploy, solo con cambios de infraestructura del propio chart.
        - repoURL: https://github.com/hersmd/Practicas-SA-B-201704312.git
          targetRevision: "{{chartRevision}}"
          path: "P10/charts/{{component}}"
          helm:
            valueFiles:
              - "values-{{env}}.yaml"
              - "$values/apps/{{component}}/image-{{env}}.yaml"
            releaseName: "{{component}}-{{env}}"
        # Fuente 2: los VALORES, en ESTE repo (GitOps) — es lo único
        # que el pipeline toca automáticamente (image.yaml, vía PR).
        - repoURL: https://github.com/hersmd/eventosu-gitops.git
          targetRevision: main
          # Fuente de values exclusivamente: no especificar path, o Argo CD
          # intenta renderizar image.yaml como manifiesto Kubernetes.
          ref: values
        # Fuente 3: el SealedSecret de ESE ambiente, aplicado como
        # manifiesto crudo (no es un value de Helm) — kubeseal ya
        # produce el YAML final, solo hay que sincronizarlo tal cual.
        - repoURL: https://github.com/hersmd/eventosu-gitops.git
          targetRevision: main
          path: "apps/{{component}}/sealed-secrets"
          directory:
            include: "sealed-secret-{{env}}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false # los namespaces los crea Terraform, no ArgoCD
